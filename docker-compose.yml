version: '3.8'

services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v23.3.6
    container_name: lakehouse-redpanda
    command:
      - redpanda start
      - --smp 1
      - --memory 1G
      - --overprovisioned
      - --node-id 0
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr 0.0.0.0:8082
      - --advertise-pandaproxy-addr localhost:8082
      - --rpc-addr 0.0.0.0:33145
      - --advertise-rpc-addr redpanda:33145
      - --mode dev-container
    ports:
      - "19092:19092"
      - "9092:9092"
      - "8082:8082"
      - "8081:8081"
    healthcheck:
      test: ["CMD", "rpk", "cluster", "info"]
      interval: 5s
      timeout: 3s
      retries: 5

  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v2.3.8
    container_name: lakehouse-redpanda-console
    ports:
      - "8088:8080"
    environment:
      KAFKA_BROKERS: redpanda:9092
    depends_on:
      redpanda:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg16
    container_name: lakehouse-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: lakehouse_db
      POSTGRES_USER: lakehouse_user
      POSTGRES_PASSWORD: lakehouse_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lakehouse_user -d lakehouse_db"]
      interval: 5s
      timeout: 3s
      retries: 5

  adminer:
    image: adminer:4.8.1
    container_name: lakehouse-adminer
    ports:
      - "8085:8080"
    depends_on:
      - postgres

volumes:
  pgdata:
